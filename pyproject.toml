[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge-search"
version = "0.1.0"
description = "Evidence-guided search for executable algorithms"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
quantforge = "quantforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
